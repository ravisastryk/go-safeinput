name: Weekly Impact Scan

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Create metrics directory
        run: mkdir -p metrics

      - name: Run Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cmd/scanner
          go run . -output ../../metrics/scan_$(date +%Y%m%d).json

      - name: Generate Report
        run: |
          latest=$(ls -t metrics/scan_*.json | head -1)

          # Calculate CWE-specific totals
          cwe502=$(jq '[.results[] | select(.pattern.name | startswith("cwe502"))] | map(.count) | add // 0' $latest)
          cwe79=$(jq '[.results[] | select(.pattern.name | startswith("cwe79"))] | map(.count) | add // 0' $latest)
          cwe89=$(jq '[.results[] | select(.pattern.name | startswith("cwe89"))] | map(.count) | add // 0' $latest)
          cwe22=$(jq '[.results[] | select(.pattern.name | startswith("cwe22"))] | map(.count) | add // 0' $latest)
          cwe78=$(jq '[.results[] | select(.pattern.name | startswith("cwe78"))] | map(.count) | add // 0' $latest)

          cat > metrics/REPORT.md << EOF
          # Go Ecosystem Vulnerability Impact Report

          **Generated:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **Scanner:** [go-safeinput](https://github.com/ravisastryk/go-safeinput)
          **Coverage:** MITRE CWE Top 25 vulnerabilities

          ## Executive Summary

          | Metric | Value |
          |--------|-------|
          | **Total Vulnerable Instances** | **$(jq '.total_vulnerable' $latest)** |
          | Total Stars Affected | $(jq '.total_stars' $latest) |
          | Total Forks Affected | $(jq '.total_forks' $latest) |
          | CWEs Analyzed | 5 |

          ## Vulnerability Breakdown by CWE

          | CWE | Vulnerability Type | Instances | Severity |
          |-----|-------------------|-----------|----------|
          | **CWE-502** | Deserialization of Untrusted Data | **${cwe502}** | CRITICAL |
          | **CWE-79** | Cross-site Scripting (XSS) | **${cwe79}** | HIGH |
          | **CWE-89** | SQL Injection | **${cwe89}** | CRITICAL |
          | **CWE-22** | Path Traversal | **${cwe22}** | HIGH |
          | **CWE-78** | OS Command Injection | **${cwe78}** | CRITICAL |

          ## Detailed Pattern Analysis

          ### CWE-502: Deserialization of Untrusted Data

          $(jq -r '.results[] | select(.pattern.name | startswith("cwe502")) | "- **\(.pattern.description)**: \(.count) instances"' $latest)

          ### CWE-79: Cross-site Scripting (XSS)

          $(jq -r '.results[] | select(.pattern.name | startswith("cwe79")) | "- **\(.pattern.description)**: \(.count) instances"' $latest)

          ### CWE-89: SQL Injection

          $(jq -r '.results[] | select(.pattern.name | startswith("cwe89")) | "- **\(.pattern.description)**: \(.count) instances"' $latest)

          ### CWE-22: Path Traversal

          $(jq -r '.results[] | select(.pattern.name | startswith("cwe22")) | "- **\(.pattern.description)**: \(.count) instances"' $latest)

          ### CWE-78: OS Command Injection

          $(jq -r '.results[] | select(.pattern.name | startswith("cwe78")) | "- **\(.pattern.description)**: \(.count) instances"' $latest)

          ## Fix with go-safeinput

          ### CWE-502: Safe Deserialization
          \`\`\`go
          import "github.com/ravisastryk/go-safeinput/safedeserialize"

          var user User
          err := safedeserialize.JSON(data, &user)
          \`\`\`

          ### CWE-79: HTML Sanitization
          \`\`\`go
          import "github.com/ravisastryk/go-safeinput/html"

          safe := html.Sanitize(userInput, html.ContextBody)
          \`\`\`

          ### CWE-89: SQL Identifier Sanitization
          \`\`\`go
          import "github.com/ravisastryk/go-safeinput/sql"

          safeID, err := sql.SanitizeIdentifier(userTable)
          \`\`\`

          ### CWE-22: Path Sanitization
          \`\`\`go
          import "github.com/ravisastryk/go-safeinput/path"

          safePath, err := path.Sanitize(userPath)
          \`\`\`

          ### CWE-78: Shell Argument Sanitization
          \`\`\`go
          import "github.com/ravisastryk/go-safeinput"

          safeArg, err := safeinput.Sanitize(userArg, safeinput.ContextShellArg)
          \`\`\`

          ## MITRE CWE References

          - [CWE-502: Deserialization of Untrusted Data](https://cwe.mitre.org/data/definitions/502.html)
          - [CWE-79: Cross-site Scripting](https://cwe.mitre.org/data/definitions/79.html)
          - [CWE-89: SQL Injection](https://cwe.mitre.org/data/definitions/89.html)
          - [CWE-22: Path Traversal](https://cwe.mitre.org/data/definitions/22.html)
          - [CWE-78: OS Command Injection](https://cwe.mitre.org/data/definitions/78.html)
          EOF

      - name: Update README badges
        run: |
          latest=$(ls -t metrics/scan_*.json | head -1)

          # Calculate totals
          total_count=$(jq '.total_vulnerable' $latest)
          stars=$(jq '.total_stars' $latest)

          # Calculate CWE-specific totals
          cwe502=$(jq '[.results[] | select(.pattern.name | startswith("cwe502"))] | map(.count) | add // 0' $latest)
          cwe79=$(jq '[.results[] | select(.pattern.name | startswith("cwe79"))] | map(.count) | add // 0' $latest)
          cwe89=$(jq '[.results[] | select(.pattern.name | startswith("cwe89"))] | map(.count) | add // 0' $latest)
          cwe22=$(jq '[.results[] | select(.pattern.name | startswith("cwe22"))] | map(.count) | add // 0' $latest)
          cwe78=$(jq '[.results[] | select(.pattern.name | startswith("cwe78"))] | map(.count) | add // 0' $latest)

          # Format numbers with commas
          formatted_total=$(printf "%'d" $total_count)
          formatted_502=$(printf "%'d" $cwe502)
          formatted_79=$(printf "%'d" $cwe79)
          formatted_89=$(printf "%'d" $cwe89)
          formatted_22=$(printf "%'d" $cwe22)
          formatted_78=$(printf "%'d" $cwe78)

          # Update individual CWE badges in table
          sed -i "s|CWE--502-[0-9]*-|CWE--502-${cwe502}-|" README.md
          sed -i "s|CWE--79-[A-Z0-9]*-|CWE--79-${cwe79}-|" README.md
          sed -i "s|CWE--89-[A-Z0-9]*-|CWE--89-${cwe89}-|" README.md
          sed -i "s|CWE--22-[A-Z0-9]*-|CWE--22-${cwe22}-|" README.md
          sed -i "s|CWE--78-[A-Z0-9]*-|CWE--78-${cwe78}-|" README.md

          # Update instance counts in table
          sed -i "s|\*\*169,392\*\*|**${formatted_502}**|" README.md
          sed -i "s/| \*\*TBD\*\* | 🟠 HIGH |/| **${formatted_79}** | 🟠 HIGH |/" README.md
          sed -i "0,/| \*\*TBD\*\* | 🔴 CRITICAL |/s//| **${formatted_89}** | 🔴 CRITICAL |/" README.md
          sed -i "0,/| \*\*TBD\*\* | 🟠 HIGH |/s//| **${formatted_22}** | 🟠 HIGH |/" README.md
          sed -i "0,/| \*\*TBD\*\* | 🔴 CRITICAL |/s//| **${formatted_78}** | 🔴 CRITICAL |/" README.md

          # Update total badges
          sed -i "s|total_vulnerable-[0-9]*-|total_vulnerable-${total_count}-|" README.md
          sed -i "s|stars_affected-[0-9]*-|stars_affected-${stars}-|" README.md

      - name: Commit and Push to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage changes
          git add metrics/
          git add README.md || true

          # Only commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: update impact metrics $(date +%Y-%m-%d)

            - Updated vulnerability scan results
            - Refreshed CWE instance counts
            - Updated README badges

            [skip ci]"

            # Push directly to main
            git push origin main

            echo "Metrics updated and pushed to main"
          else
            echo " No changes to commit"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
