# golangci-lint v2 configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - ineffassign
    - staticcheck

    # Additional linters
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    funlen:
      lines: 100
      statements: 50

    gocyclo:
      min-complexity: 15

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G304

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

  exclusions:
    paths:
      - examples/ # demo code; before/ is intentionally vulnerable
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - noctx  # httptest.NewRequest without context is acceptable in tests
          - gosec  # test code doesn't require MaxBytesReader guards

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
